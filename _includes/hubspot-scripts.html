<script src="https://js-eu1.hsforms.net/forms/embed/v2.js" charset="utf-8"></script>
<script>
  if (window.hbspt && window.hbspt.forms) {
    document.querySelectorAll('[data-hubspot-form]').forEach((container) => {
      window.hbspt.forms.create({
        region: 'eu1',
        portalId: '26908563',
        formId: container.dataset.hubspotForm,
        target: '#' + container.id,
        formInstanceId: container.id
      });
    });
  }
</script>
